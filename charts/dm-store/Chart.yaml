description: Helm chart for the HMCTS CDM Document Management APO
apiVersion: v2
name: dm-store
home: https://github.com/hmcts/document-management-store-app
version: 3.0.0
maintainers:
  - name: HMCTS Evidence Management Team
    email: EvidenceManagement@HMCTS.NET
dependencies:
  - name: java
    version: 6.1.1
    repository: oci://hmctsprod.azurecr.io/helm
    condition: java.enabled
  - name: job
    version: 2.2.2
    repository: oci://hmctsprod.azurecr.io/helm
    condition: job.enabled
  - name: blobstorage
    version: 2.3.2
    repository: oci://hmctsprod.azurecr.io/helm
    condition: blobstorage.enabled
  - name: xui-webapp
    version: ~1.0.6
    repository: oci://hmctsprod.azurecr.io/helm
    condition: xui-webapp.enabled
